# Activated with SPRING_PROFILES_ACTIVE=local (or -Dspring-boot.run.profiles=local).
# Points the transcription client at this app's own in-process STT stub
# (see LocalSttStubController) instead of the real OpenAI API, so local
# development doesn't need a real OPENAI_API_KEY or network access.
openai.api.base-url=http://localhost:8080
OPENAI_API_KEY=local-dev-stub-key
